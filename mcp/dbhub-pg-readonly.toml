# dbhub (PostgreSQL MCP) 읽기 전용 설정 — 서버별 접속 정보는 ~/.claude.json 의 env 로 받는다.
# PG_PASSWORD 는 mcp-secret-env 가 1Password 에서 꺼내 넘긴다. 이 파일에 값을 쓰지 않는다.
# readonly = true 는 세 겹으로 막는다: 문장 분류 · 세션 default_transaction_read_only=on · BEGIN READ ONLY
#
# 주의: 이 파일은 시험 DB 와 운영 조회용 (payment-prod-reader) 이 함께 읽는다. readonly 를 false 로 바꾸면
# 운영 조회의 쓰기 차단도 같이 풀린다. 쓰기가 필요한 서버가 생기면 이 파일을 고치지 말고 설정 파일을 따로 만든다.
[[sources]]
id = "main"
type = "postgres"
host = "${PG_HOST}"
port = "${PG_PORT}"
database = "${PG_DB}"
user = "${PG_USER}"
password = "${PG_PASSWORD}"

[[tools]]
name = "execute_sql"
source = "main"
readonly = true
